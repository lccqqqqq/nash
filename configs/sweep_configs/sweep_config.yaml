program: solver.py
method: bayes  # Options: grid, random, bayes
metric:
  name: welfare
  goal: maximize

parameters:
  # State initialization
  chi:
    value: 16

  # Optimization parameters
  eps:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1

  num_perturbations:
    value: 20

  # Nash equilibrium subroutine
  subroutine_lr:
    value: 0.06

  max_subroutine_lr:
    value: 1.0

  subroutine_max_iter:
    value: 1000

  expl_check_interval:
    value: 50

  expl_maxiter:
    value: 100

  real_strategies:
    value: true

  # Fixed parameters
  max_num_steps:
    value: 800

  num_players:
    value: 5

  use_wandb:
    value: true

  wandb_project:
    value: nash-equilibrium

  save_results:
    value: true

  save_dir:
    value: data

# Early termination configuration (optional)
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 2
