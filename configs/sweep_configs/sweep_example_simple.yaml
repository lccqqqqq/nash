# Simple W&B sweep configuration for quick testing
# This runs a grid search over a small parameter space

program: solver.py
method: grid  # Grid search for exhaustive coverage of parameter space

metric:
  name: welfare
  goal: maximize

parameters:
  # Small grid for testing
  chi:
    values: [2, 4]

  eps:
    values: [0.01, 0.02]

  num_perturbations:
    value: 10

  # Fixed parameters
  max_num_steps:
    value: 50  # Shorter for quick testing

  subroutine_lr:
    value: 0.06

  max_subroutine_lr:
    value: 1.0

  subroutine_max_iter:
    value: 1000

  expl_check_interval:
    value: 50

  expl_maxiter:
    value: 100

  real_strategies:
    value: true

  num_players:
    value: 3

  use_wandb:
    value: true

  wandb_project:
    value: nash-equilibrium-sweep

  save_results:
    value: true

  save_dir:
    value: data/sweeps
